upstream backend {
    server localhost:8001 weight=3 max_fails=2 fail_timeout=30s;
    server localhost:8002 weight=2 max_fails=2 fail_timeout=30s;
    server localhost:8003 weight=1 max_fails=2 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
