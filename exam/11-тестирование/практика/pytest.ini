[pytest]
testpaths = примеры/unit примеры/integration примеры/e2e примеры/pytest
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    slow: медленные тесты (помечайте тесты, требующие времени)
    fast: быстрые тесты (помечайте быстрые unit-тесты)
    integration: интеграционные тесты (помечайте комплексные тесты)
    unit: юнит тесты
    e2e: end-to-end тесты
