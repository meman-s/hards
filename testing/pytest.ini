[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    slow: медленные тесты
    integration: интеграционные тесты
    unit: юнит тесты
    e2e: end-to-end тесты
playwright_browser = chromium
playwright_headed = False
playwright_timeout = 30000
